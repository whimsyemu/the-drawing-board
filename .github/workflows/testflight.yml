name: TestFlight

# Builds the iOS app (ios/) around the current index.html and uploads it to
# App Store Connect / TestFlight. Runs on every push to main, or by hand from
# the Actions tab ("Run workflow").

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
      DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
      APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
      PROFILE_NAME: Drawing Board App Store
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys" build
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install signing certificate and profile
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          # Apple WWDR intermediates so the identity chains to a trusted root
          for g in G3 G4 G5 G6 G7 G8; do
            curl -fsSL -o "$RUNNER_TEMP/wwdr$g.cer" "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer" && security import "$RUNNER_TEMP/wwdr$g.cer" -k "$KC" -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          printf '%s' "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/DrawingBoard_AppStore.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/DrawingBoard_AppStore.mobileprovision" | plutil -extract Name raw -
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Archive
        run: |
          set +e
          xcodebuild archive \
            -project ios/DrawingBoard.xcodeproj \
            -scheme DrawingBoard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DrawingBoard.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > build/archive.log 2>&1
          rc=$?
          grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" build/archive.log || true
          if [ $rc -ne 0 ]; then echo "::group::archive.log (tail)"; tail -n 150 build/archive.log; echo "::endgroup::"; exit $rc; fi

      - name: Upload to App Store Connect
        run: |
          set +e
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ios/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/DrawingBoard.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/export.log 2>&1
          rc=$?
          grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" build/export.log || true
          if [ $rc -ne 0 ]; then echo "::group::export.log (tail)"; tail -n 150 build/export.log; echo "::endgroup::"; exit $rc; fi

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore
